name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build mold \
            liblua5.4-dev zlib1g-dev libtinyxml-dev libsqlite3-dev \
            libcivetweb-dev libjsoncpp-dev prometheus-cpp-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release .
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify binary
        run: ./build/PtokaX -v

  debug-sanitizer:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build mold \
            liblua5.4-dev zlib1g-dev libtinyxml-dev libsqlite3-dev \
            libcivetweb-dev libjsoncpp-dev prometheus-cpp-dev

      - name: Configure Debug with sanitizers
        run: cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug .

      - name: Build
        run: cmake --build build-debug -j$(nproc)

      - name: Run with sanitizer
        run: |
          mkdir -p /tmp/test-cfg
          timeout 10 ./build-debug/PtokaX -c /tmp/test-cfg || true

  clang-tidy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build mold clang-tidy \
            liblua5.4-dev zlib1g-dev libtinyxml-dev libsqlite3-dev \
            libcivetweb-dev libjsoncpp-dev prometheus-cpp-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON .

      - name: Run clang-tidy
        run: |
          find core -name "*.cpp" | head -20 | xargs clang-tidy -p build \
            --checks='-*,modernize-use-nullptr,modernize-use-override' 2>&1 | tail -20

  clang-format:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find core -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run --Werror 2>&1 | head -20 || echo "Formatting issues found (non-blocking)"
