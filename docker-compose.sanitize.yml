# ASan/UBSan override for docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sanitize.yml build ptokax
#   docker compose -f docker-compose.yml -f docker-compose.sanitize.yml up -d ptokax
# ASan/UBSan reports are written to ./asan-reports/ (mounted to /app/asan-reports).
services:
  ptokax:
    build:
      args:
        BUILD_TYPE: Debug
    user: "1003:1003"
    environment:
      - ASAN_OPTIONS=log_path=/app/asan-reports/asan:detect_leaks=1:halt_on_error=0:abort_on_error=0
      - LSAN_OPTIONS=suppressions=/app/asan.supp
      - UBSAN_OPTIONS=log_path=/app/asan-reports/ubsan:print_stacktrace=1:halt_on_error=0
    volumes:
      - ./asan-reports:/app/asan-reports
