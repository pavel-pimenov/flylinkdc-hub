[api]
enabled = false

[sources.system_log]
type = "file"
include = ["/logs/system.log"]
ignore_older_secs = 86400
ignore_checkpoints = true
read_from = "beginning"

[sources.debug_log]
type = "file"
include = ["/logs/debug.log"]
ignore_older_secs = 86400
ignore_checkpoints = true
read_from = "beginning"

[transforms.tag_system]
type = "remap"
inputs = ["system_log"]
source = """
.service = "ptokax"
.file = "system.log"
.level = "INFO"
"""

[transforms.tag_debug]
type = "remap"
inputs = ["debug_log"]
source = """
.service = "ptokax"
.file = "debug.log"
.level = "DEBUG"
"""

[sinks.victorialogs]
type = "http"
inputs = ["tag_system", "tag_debug"]
uri = "http://victorialogs:9428/insert/jsonline?_stream_fields=service,file&_msg_field=message"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
[sinks.victorialogs.request]
retry_initial_backoff_secs = 1
retry_max_duration_secs = 30
timeout_secs = 10
[sinks.victorialogs.buffer]
type = "memory"
max_events = 1000
